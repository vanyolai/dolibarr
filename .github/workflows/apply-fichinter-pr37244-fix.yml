name: Apply corrected intervention fix

on:
  push:
    branches:
      - '23.0'
    paths:
      - '.github/workflows/apply-fichinter-pr37244-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '23.0'
          fetch-depth: 1

      - name: Apply corrected PR 37244 changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('htdocs/fichinter/card.php')
          text = path.read_text()

          replacements = [
              (
                  "\t\t\t\t\t\t\t\tdefault:\n\t\t\t\t\t\t\t\tcase 'h':",
                  "\t\t\t\t\t\t\t\tcase 's':\n\t\t\t\t\t\t\t\t\t$mult = 1;\n\t\t\t\t\t\t\t\t\tbreak;\n\t\t\t\t\t\t\t\tcase 'mn':\n\t\t\t\t\t\t\t\t\t$mult = 60;\n\t\t\t\t\t\t\t\t\tbreak;\n\t\t\t\t\t\t\t\tdefault:\n\t\t\t\t\t\t\t\tcase 'h':"
              ),
              (
                  "$duration = (int) $prod->duration_value * $mult * $lines[$i]->qty;",
                  "$duration = (int) round(((float) $prod->duration_value) * $mult * $lines[$i]->qty);"
              ),
              (
                  "$desc .= ' ('.$langs->trans('Quantity').': '.$lines[$i]->qty.')';",
                  "$unit_label = '';\n\t\t\t\t\tif ($lines[$i]->fk_unit) {\n\t\t\t\t\t\t$langs->load('measuring_units');\n\t\t\t\t\t\t$unit_label = $langs->trans($lines[$i]->getLabelOfUnit('short'));\n\t\t\t\t\t}\n\t\t\t\t\t$desc .= ' ('.$langs->trans('Quantity').': '.$lines[$i]->qty.($unit_label ? ' '.$unit_label : '').')';"
              ),
              (
                  "$timearray = dol_getdate(dol_now());\n\t\t\t\t\t$date_intervention = dol_mktime(0, 0, 0, $timearray['mon'], $timearray['mday'], $timearray['year']);",
                  "$source_date = (!empty($srcobject->delivery_date) ? $srcobject->delivery_date : dol_now());\n\t\t\t\t\t$timearray = dol_getdate($source_date);\n\t\t\t\t\t$date_intervention = dol_mktime($timearray['hours'], $timearray['minutes'], 0, $timearray['mon'], $timearray['mday'], $timearray['year']);"
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Syntax check
        run: php -l htdocs/fichinter/card.php

      - name: Commit corrected fix and remove temporary workflow
        run: |
          rm .github/workflows/apply-fichinter-pr37244-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add htdocs/fichinter/card.php .github/workflows/apply-fichinter-pr37244-fix.yml
          git commit -m "Fix intervention source date and service duration handling"
          git push origin HEAD:23.0
