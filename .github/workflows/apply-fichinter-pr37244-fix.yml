name: Apply corrected intervention fix

on:
  push:
    branches:
      - '23.0'
    paths:
      - '.github/workflows/apply-fichinter-pr37244-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '23.0'
          fetch-depth: 1

      - name: Apply corrected PR 37244 changes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('htdocs/fichinter/card.php')
          text = path.read_text()

          # Add Dolibarr's canonical seconds/minutes units to the existing switch.
          pattern = r"(if \(\$prod->duration_value && getDolGlobalString\('FICHINTER_USE_SERVICE_DURATION'\)\) \{\s*switch \(\$prod->duration_unit\) \{\s*)(default:\s*case 'h':)"
          replacement = r"\1case 's':\n\t\t\t\t\t\t\t\t\t$mult = 1;\n\t\t\t\t\t\t\t\t\tbreak;\n\t\t\t\t\t\t\t\tcase 'mn':\n\t\t\t\t\t\t\t\t\t$mult = 60;\n\t\t\t\t\t\t\t\t\tbreak;\n\t\t\t\t\t\t\t\t\2"
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Failed to patch time-unit switch: {count} matches')

          replacements = [
              (
                  "$duration = (int) $prod->duration_value * $mult * $lines[$i]->qty;",
                  "$duration = (int) round(((float) $prod->duration_value) * $mult * $lines[$i]->qty);"
              ),
              (
                  "$desc .= ' ('.$langs->trans('Quantity').': '.$lines[$i]->qty.')';",
                  "$unit_label = '';\n\t\t\t\t\tif ($lines[$i]->fk_unit) {\n\t\t\t\t\t\t$langs->load('measuring_units');\n\t\t\t\t\t\t$unit_label = $langs->trans($lines[$i]->getLabelOfUnit('short'));\n\t\t\t\t\t}\n\t\t\t\t\t$desc .= ' ('.$langs->trans('Quantity').': '.$lines[$i]->qty.($unit_label ? ' '.$unit_label : '').')';"
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          date_pattern = r"\$timearray = dol_getdate\(dol_now\(\)\);\s*\$date_intervention = dol_mktime\(0, 0, 0, \$timearray\['mon'\], \$timearray\['mday'\], \$timearray\['year'\]\);"
          date_replacement = "$source_date = (!empty($srcobject->delivery_date) ? $srcobject->delivery_date : dol_now());\n\t\t\t\t\t$timearray = dol_getdate($source_date);\n\t\t\t\t\t$date_intervention = dol_mktime($timearray['hours'], $timearray['minutes'], 0, $timearray['mon'], $timearray['mday'], $timearray['year']);"
          text, count = re.subn(date_pattern, lambda m: date_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Failed to patch intervention date: {count} matches')

          path.write_text(text)

      - name: Syntax check
        run: php -l htdocs/fichinter/card.php

      - name: Commit corrected fix and remove temporary workflow
        run: |
          rm .github/workflows/apply-fichinter-pr37244-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add htdocs/fichinter/card.php .github/workflows/apply-fichinter-pr37244-fix.yml
          git commit -m "Fix intervention source date and service duration handling"
          git push origin HEAD:23.0
